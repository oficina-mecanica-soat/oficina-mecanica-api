<text x="80" y="1287" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#24354b">Cada serviço mantém Clean Architecture. Setas tracejadas: mensageria/integração. Semântica: contratos da RFC-0007.</text>
