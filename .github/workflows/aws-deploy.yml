name: "☁️ AWS Deploy"
run-name: "☁️ Executar deploy AWS da API em ${{ inputs.environment_name }}"

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment used by this deploy."
        required: true
        type: string
      terraform_environment_directory:
        description: "Diretório do ambiente Terraform."
        required: true
        type: string
      ssm_environment_name:
        description: "Nome do ambiente nos paths SSM."
        required: true
        type: string
    outputs:
      terraform_action:
        description: "Resolved Terraform action: apply or destroy."
        value: ${{ jobs.resolve_action.outputs.terraform_action }}

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/${{ inputs.terraform_environment_directory }}
  SSM_ENVIRONMENT_NAME: ${{ inputs.ssm_environment_name }}
  SSM_KUBERNETES_STATUS_PARAMETER: /oficina-mecanica/${{ inputs.ssm_environment_name }}/status/kubernetes
  SSM_KUBERNETES_PREFIX: /oficina-mecanica/${{ inputs.ssm_environment_name }}/kubernetes
  SSM_RDS_STATUS_PARAMETER: /oficina-mecanica/${{ inputs.ssm_environment_name }}/status/rds
  SSM_RDS_PREFIX: /oficina-mecanica/${{ inputs.ssm_environment_name }}/rds
  TERRAFORM_VERSION: "1.15.8"

jobs:
  resolve_action:
    name: "🔎 01 · Resolver ação do Terraform"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      terraform_action: ${{ steps.resolve_terraform_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop

      - name: "🚦 02 · Ler terraform-action.env e validar troca segura de destroy"
        id: resolve_terraform_action
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
        run: |
          control_file="$TF_WORKING_DIRECTORY/terraform-action.env"
          terraform_action="$(grep -E '^[[:space:]]*TERRAFORM_ACTION[[:space:]]*=' "$control_file" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          case "$terraform_action" in
            apply|destroy)
              ;;
            *)
              echo "::error::Invalid TERRAFORM_ACTION '$terraform_action'. Use 'apply' or 'destroy'."
              exit 1
              ;;
          esac

          if [ "$terraform_action" = "destroy" ]; then
            destroy_control_changed="false"

            if [ -z "$GITHUB_BEFORE" ] || [ "$GITHUB_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              destroy_control_changed="true"
            elif git diff --name-only "$GITHUB_BEFORE" "$GITHUB_AFTER" -- "$control_file" | grep -qx "$control_file"; then
              destroy_control_changed="true"
            fi

            if [ "$destroy_control_changed" != "true" ]; then
              echo "::error::TERRAFORM_ACTION=destroy is present but terraform-action.env was not changed in this push. Change it back to apply or open a dedicated destroy PR."
              exit 1
            fi

            echo "::warning::TERRAFORM_ACTION=destroy detected. This run will destroy AWS resources managed by Terraform."
          fi

          if [ "$terraform_action" = "apply" ]; then
            echo "::notice::>>> ACAO DECIDIDA: APPLY (criar/atualizar recursos AWS) <<<"
          else
            echo "::notice::>>> ACAO DECIDIDA: DESTROY (destruir recursos AWS) <<<"
          fi

          echo "terraform_action=$terraform_action" >> "$GITHUB_OUTPUT"

  prepare_and_plan:
    name: "📋 02 · Preparar variáveis e gerar plano do Terraform"
    needs: resolve_action
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      account_id: ${{ steps.prepare_vars.outputs.account_id }}
      ecr_image_uri: ${{ steps.prepare_vars.outputs.ecr_image_uri }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "✅ 04 · Validar segredos necessários para o deploy"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            echo "Skipping application secret validation because this run will destroy the environment."
            exit 0
          fi

          missing=""

          for name in JWT_SECRET WEBHOOK_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing required GitHub Environment secrets:$missing"
            exit 1
          fi

      - name: "🏷️ 05 · Validar infraestrutura compartilhada e montar a tag da imagem"
        id: prepare_vars
        run: |
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            echo "AWS_ACCOUNT_ID=destroy-only-placeholder" >> "$GITHUB_ENV"
            echo "ECR_IMAGE_URI=destroy-only-placeholder" >> "$GITHUB_ENV"
            echo "account_id=destroy-only-placeholder" >> "$GITHUB_OUTPUT"
            echo "ecr_image_uri=destroy-only-placeholder" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(aws ssm get-parameter --name "$SSM_KUBERNETES_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready"
          test "$(aws ssm get-parameter --name "$SSM_RDS_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready"
          ecr_repository_name="$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/ecr_repository_name" --query 'Parameter.Value' --output text)"
          ecr_repository_url="$(aws ssm get-parameter --name "$SSM_KUBERNETES_PREFIX/ecr_repository_url" --query 'Parameter.Value' --output text)"
          test -n "$ecr_repository_name" && test -n "$ecr_repository_url"
          aws ecr describe-repositories --repository-names "$ecr_repository_name" --query 'repositories[0].repositoryName' --output text
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_image_uri="$ecr_repository_url:sha-$GITHUB_SHA"

          echo "AWS_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "ECR_IMAGE_URI=$ecr_image_uri" >> "$GITHUB_ENV"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "ecr_image_uri=$ecr_image_uri" >> "$GITHUB_OUTPUT"

      - name: "📦 06 · Restaurar cache do state do Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - name: "📝 07 · Escrever variáveis do Terraform"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def aws_output(*args):
              result = subprocess.run(
                  ["aws", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          terraform_action = os.environ["TERRAFORM_ACTION"]

          if terraform_action == "destroy":
              db_connection_string = "destroy-only-placeholder"
              jwt_secret = "destroy-only-placeholder"
              webhook_token = "destroy-only-placeholder"
          else:
              endpoint = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/endpoint", "--query", "Parameter.Value", "--output", "text")
              secret_arn = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/master_secret_arn", "--query", "Parameter.Value", "--output", "text")
              if not endpoint or not secret_arn:
                  raise ValueError("RDS endpoint ou ARN do segredo não foi publicado.")
              secret_string = aws_output("secretsmanager", "get-secret-value", "--secret-id", secret_arn, "--query", "SecretString", "--output", "text")
              try:
                  secret = json.loads(secret_string)
              except json.JSONDecodeError as error:
                  raise ValueError("SecretString do RDS não contém JSON válido.") from error
              username = secret.get("username")
              password = secret.get("password")
              if not username or not password:
                  raise ValueError("SecretString do RDS não contém username e password.")
              db_connection_string = f"Server=tcp:{endpoint},1433;Database=OficinaMecanicaDb;User Id={username};Password={password};TrustServerCertificate=True;"
              print(f"::add-mask::{username}")
              print(f"::add-mask::{password}")
              print(f"::add-mask::{db_connection_string}")
              jwt_secret = os.environ["JWT_SECRET"]
              webhook_token = os.environ["WEBHOOK_TOKEN"]

          values = {
              "aws_region": os.environ["AWS_REGION"],
              "ssm_environment_name": os.environ["SSM_ENVIRONMENT_NAME"],
              "db_connection_string": db_connection_string,
              "api_deploy_enabled": True,
              "api_image_uri": os.environ["ECR_IMAGE_URI"],
              "jwt_secret": jwt_secret,
              "webhook_token": webhook_token,
          }

          target = Path(os.environ["TF_WORKING_DIRECTORY"]) / "zz_ci.auto.tfvars.json"
          os.umask(0o077)
          target.write_text(json.dumps(values), encoding="utf-8")
          PY

      - &validacoes_inline
        name: "🛡️ Preparar validações definidas no workflow"
        run: |
          cat > "$RUNNER_TEMP/bootstrap-account-state.cjs" <<'VALIDACAO_INLINE_0'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');

          function projectResource(resource) {
            return /oficina.?mecanica/i.test(JSON.stringify(resource));
          }
          function checkEmpty(label, resources) {
            if (!Array.isArray(resources)) throw new Error(`Resposta inválida: ${label}`);
            if (resources.some(projectResource)) throw new Error(`${label}: há recursos do projeto; bootstrap sem state bloqueado.`);
          }
          function main() {
            const dir = process.env.TF_WORKING_DIRECTORY;
            const stateFile = path.join(dir, 'terraform.tfstate');
            const aws = (...args) => JSON.parse(cp.execFileSync('aws', [...args, '--region', process.env.AWS_REGION || 'us-east-1', '--output', 'json'], {encoding:'utf8',stdio:['ignore','pipe','pipe']}));
            const account = aws('sts','get-caller-identity').Account;
            if (fs.existsSync(stateFile)) {
              const state = JSON.parse(fs.readFileSync(stateFile,'utf8'));
              for (const r of (state.resources || []).filter(r=>r.mode==='managed')) {
                for (const i of r.instances || []) {
                  const a = i.attributes || {};
                  const accounts = [a.owner_id,a.registry_id,a.arn?.match(/^arn:[^:]+:[^:]*:[^:]*:(\d{12}):/)?.[1],i.identity?.account_id].filter(Boolean);
                  if (accounts.some(id=>id!==account)) throw new Error('State pertence a outra conta AWS; operação bloqueada.');
                }
              }
              console.log(`State restaurado no escopo da conta ${account}.`);
              return;
            }
            if (process.env.TERRAFORM_ACTION !== 'destroy') throw new Error('Cache da conta ausente. Bootstrap exige destroy dedicado e ambiente vazio.');
            const checks = [
              ['EKS',['eks','list-clusters'],'clusters'],
              ['RDS',['rds','describe-db-instances'],'DBInstances'],
              ['Lambda',['lambda','list-functions'],'Functions'],
              ['API Gateway',['apigatewayv2','get-apis'],'Items'],
              ['VPC Link',['apigatewayv2','get-vpc-links'],'Items'],
              ['ECR',['ecr','describe-repositories'],'repositories'],
              ['DynamoDB',['dynamodb','list-tables'],'TableNames'],
              ['SQS',['sqs','list-queues','--max-results','1000'],'QueueUrls'],
              ['Load Balancers',['elbv2','describe-load-balancers'],'LoadBalancers'],
              ['VPC',['ec2','describe-vpcs'],'Vpcs'],
              ['Subnets',['ec2','describe-subnets'],'Subnets'],
              ['Security groups',['ec2','describe-security-groups'],'SecurityGroups'],
              ['Volumes',['ec2','describe-volumes'],'Volumes'],
              ['IPs elásticos',['ec2','describe-addresses'],'Addresses'],
              ['Secrets (somente metadados)',['secretsmanager','list-secrets','--include-planned-deletion'],'SecretList'],
              ['CloudWatch',['logs','describe-log-groups'],'logGroups'],
            ];
            for (const [label,args,key] of checks) {
              const resultado = aws(...args);
              checkEmpty(label, label === 'SQS' && !('QueueUrls' in resultado) ? [] : resultado[key]);
              console.log(`${label}: nenhum recurso do projeto encontrado.`);
            }
            const parameters = aws('ssm','describe-parameters','--parameter-filters','Key=Name,Option=BeginsWith,Values=/oficina-mecanica/development/').Parameters;
            if (!Array.isArray(parameters) || parameters.length) throw new Error('SSM: contratos existentes ou resposta inválida; bootstrap bloqueado.');
            console.log(`Bootstrap autorizado somente para destroy: conta ${account} sem recursos do projeto. Caches históricos de outras contas preservados e fora da restauração.`);
          }
          module.exports={checkEmpty,projectResource};
          if(require.main===module) {try{main();}catch(error){console.error(error.message);process.exit(1);}}
          VALIDACAO_INLINE_0
          cat > "$RUNNER_TEMP/prepare-destroy.cjs" <<'VALIDACAO_INLINE_1'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');

          function destroyConfig(state, region, confirmClusterAbsent) {
            const resources = state.resources || [];
            if (resources.some(r => /module\..*provider\[/.test(r.provider || ''))) {
              throw new Error('Provider definido dentro de módulo exige tratamento específico; destroy bloqueado.');
            }
            const kubernetes = resources.filter(r => r.mode === 'managed' && r.type.startsWith('kubernetes_'));
            let config = `provider "aws" { region = ${JSON.stringify(region)} }\n`;
            if (kubernetes.length) {
              const clusters = resources.filter(r => r.mode === 'data' && r.type === 'aws_eks_cluster')
                .flatMap(r => (r.instances || []).map(i => i.attributes?.name)).filter(Boolean);
              if (!clusters.length) throw new Error('State Kubernetes sem nome comprovável de cluster; recuperação bloqueada.');
              if ([...new Set(clusters)].some(cluster => confirmClusterAbsent(cluster) === false)) return null;
              config += 'provider "kubernetes" {\n host = "https://127.0.0.1"\n token = "destroy-only"\n}\n';
              for (const r of kubernetes) {
                if (r.module || !/^kubernetes_\w+$/.test(r.type) || !/^\w+$/.test(r.name)) {
                  throw new Error('Endereço Kubernetes não suportado; recuperação bloqueada.');
                }
                config += `removed {\n from = ${r.type}.${r.name}\n lifecycle { destroy = false }\n}\n`;
              }
            }
            return config;
          }

          function verifyPlan(plan) {
            for (const change of plan.resource_changes || []) {
              if ((change.change?.actions || []).some(a => !['no-op', 'delete', 'forget', 'read'].includes(a))) {
                throw new Error(`Plano de destroy contém ação proibida: ${change.address}`);
              }
            }
          }

          function main() {
            if (process.env.TERRAFORM_ACTION !== 'destroy') throw new Error('Este procedimento aceita somente destroy.');
            const dir = process.env.TF_WORKING_DIRECTORY;
            if (!dir) throw new Error('Diretório Terraform ausente.');
            const run = (cmd, args) => cp.execFileSync(cmd, args, {encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe']});
            if (process.argv[2] === 'verify-plan') {
              verifyPlan(JSON.parse(run('terraform', [`-chdir=${dir}`, 'show', '-json', 'tfplan'])));
              console.log('Plano validado: nenhuma criação ou atualização permitida.');
              return;
            }
            if (process.argv[2] === 'verify-state') {
              const state = JSON.parse(fs.readFileSync(path.join(dir, 'terraform.tfstate'), 'utf8'));
              if ((state.resources || []).some(r => r.mode === 'managed' && r.instances?.length)) {
                throw new Error('State ainda contém recursos gerenciados; reconciliação incompleta.');
              }
              console.log('State final sem recursos gerenciados; cache pode ser persistido.');
              return;
            }
            const identity = JSON.parse(run('aws', ['sts', 'get-caller-identity', '--output', 'json']));
            console.log(`Destroy na conta AWS ${identity.Account}.`);
            const stateFile = path.join(dir, 'terraform.tfstate');
            const state = fs.existsSync(stateFile) ? JSON.parse(fs.readFileSync(stateFile, 'utf8')) : {resources: []};
            const config = destroyConfig(state, process.env.AWS_REGION || 'us-east-1', cluster => {
              try {
                run('aws', ['eks', 'describe-cluster', '--name', cluster, '--output', 'json']);
              } catch (error) {
                if (!String(error.stderr).includes('(ResourceNotFoundException)')) {
                  throw new Error('Consulta EKS falhou sem confirmar ausência; recuperação bloqueada.');
                }
                console.log('EKS comprovadamente ausente; remoção declarativa dos vínculos Kubernetes no plano.');
                return;
              }
              return false;
            });
            if (config === null) {
              console.log('EKS existente: preservada a configuração normal para destruir o workload.');
              return;
            }
            const backup = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'destroy-config-'));
            for (const name of fs.readdirSync(dir)) {
              if ((name.endsWith('.tf') || name.endsWith('.tf.json')) && name !== 'versions.tf') {
                fs.renameSync(path.join(dir, name), path.join(backup, name));
              }
            }
            fs.writeFileSync(path.join(dir, 'destroy_only.tf'), config);
            console.log('Configuração temporária exclusiva de destroy; state preservado integralmente.');
          }

          module.exports = {destroyConfig, verifyPlan};
          if (require.main === module) {
            try { main(); } catch (error) { console.error(error.message); process.exit(1); }
          }
          VALIDACAO_INLINE_1
          cat > "$RUNNER_TEMP/verificar-mensageria-os.cjs" <<'VALIDACAO_INLINE_2'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');

          function contratosDoState(state) {
            const atributos = (tipo, nome) => (state.resources || []).find(r => r.mode === 'managed' && !r.module && r.type === tipo && r.name === nome)?.instances?.[0]?.attributes || {};
            const entrada = atributos('aws_sqs_queue', 'os_entrada');
            const dlq = atributos('aws_sqs_queue', 'os_dlq');
            return {
              entrada_queue_url: entrada.url || entrada.id || '', entrada_queue_arn: entrada.arn || '',
              dlq_url: dlq.url || dlq.id || '', dlq_arn: dlq.arn || ''
            };
          }

          const atributosContagem = ['ApproximateNumberOfMessages', 'ApproximateNumberOfMessagesNotVisible', 'ApproximateNumberOfMessagesDelayed'];
          function verificarPendencias(contratos, consultar) {
            for (const url of [contratos.entrada_queue_url, contratos.dlq_url].filter(Boolean)) {
              const resposta = consultar('sqs', 'get-queue-attributes', '--queue-url', url, '--attribute-names', ...atributosContagem);
              if (resposta === null) continue;
              for (const atributo of atributosContagem) {
                const valor = resposta.Attributes?.[atributo];
                if (typeof valor !== 'string' || !/^\d+$/.test(valor) || Number(valor) !== 0)
                  throw new Error('Mensagens pendentes ou contagem inválida na fila/DLQ: destroy bloqueado.');
              }
            }
          }

          function verificarInfra(contratos, prefix, consultar) {
            if (Object.values(contratos).some(valor => !valor)) throw new Error('State incompleto: contratos de dados/mensageria ausentes.');
            for (const [url, arn, dlq] of [[contratos.entrada_queue_url, contratos.entrada_queue_arn, false], [contratos.dlq_url, contratos.dlq_arn, true]]) {
              const atributos = consultar('sqs', 'get-queue-attributes', '--queue-url', url, '--attribute-names', 'All')?.Attributes;
              if (!atributos || atributos.QueueArn !== arn || atributos.FifoQueue !== 'true'
                || atributos.ContentBasedDeduplication !== 'false' || atributos.MessageRetentionPeriod !== (dlq ? '1209600' : '345600'))
                throw new Error('Fila real não corresponde ao contrato FIFO/retenção.');
              if (!dlq) {
                const redrive = JSON.parse(atributos.RedrivePolicy || '{}');
                if (atributos.VisibilityTimeout !== '60' || atributos.ReceiveMessageWaitTimeSeconds !== '20'
                  || Number(redrive.maxReceiveCount) !== 5 || redrive.deadLetterTargetArn !== contratos.dlq_arn)
                  throw new Error('Fila real não corresponde à recuperação definida na RFC.');
              }
            }
            for (const [nome, valor] of Object.entries(contratos)) {
              const parametro = consultar('ssm', 'get-parameter', '--name', `${prefix}/api/${nome}`)?.Parameter;
              if (parametro?.Value !== valor || parametro.Type !== 'String') throw new Error('Contrato SSM divergente do state.');
            }
            if (consultar('ssm', 'get-parameter', '--name', `${prefix}/status/api`)?.Parameter?.Value !== 'ready')
              throw new Error('Status de mensageria de OS não está ready.');
          }

          function verificarRemocao(contratos, prefix, consultar) {
            const confirmar = (...args) => { if (consultar(...args) !== null) throw new Error('Recurso ainda existe após destroy.'); };
            for (const url of [contratos.entrada_queue_url, contratos.dlq_url].filter(Boolean)) confirmar('sqs', 'get-queue-attributes', '--queue-url', url, '--attribute-names', 'QueueArn');
            for (const nome of Object.keys(contratos)) confirmar('ssm', 'get-parameter', '--name', `${prefix}/api/${nome}`);
            confirmar('ssm', 'get-parameter', '--name', `${prefix}/status/api`);
          }

          function consultarAws(...args) {
            try {
              const resposta = JSON.parse(cp.execFileSync('aws', [...args, '--region', process.env.AWS_REGION || 'us-east-1', '--output', 'json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
              if (resposta === null || typeof resposta !== 'object' || Array.isArray(resposta)) throw new Error('Resposta AWS inválida.');
              return resposta;
            } catch (error) {
              const ausencias = { sqs: ['(AWS.SimpleQueueService.NonExistentQueue)', '(QueueDoesNotExist)'], ssm: ['(ParameterNotFound)'] };
              if (ausencias[args[0]]?.some(codigo => String(error.stderr).includes(codigo))) return null;
              throw new Error(`Consulta ${args[0]}/${args[1]} falhou sem comprovar ausência; operação bloqueada.`);
            }
          }
          function main() {
            const dir = process.env.TF_WORKING_DIRECTORY;
            const contexto = path.join(dir, 'os-mensageria-destroy-context.json');
            const stateFile = path.join(dir, 'terraform.tfstate');
            const contratos = contratosDoState(fs.existsSync(stateFile) ? JSON.parse(fs.readFileSync(stateFile, 'utf8')) : {});
            const prefix = `/oficina-mecanica/${process.env.SSM_ENVIRONMENT_NAME}`;
            switch (process.argv[2]) {
              case 'before-destroy':
                verificarPendencias(contratos, consultarAws);
                fs.writeFileSync(contexto, JSON.stringify(contratos));
                console.log('Nenhuma mensagem observada em filas/DLQ; produtores devem permanecer parados. Outbox SQL não é verificada por este guardrail.');
                break;
              case 'after-destroy':
                verificarRemocao(JSON.parse(fs.readFileSync(contexto, 'utf8')), prefix, consultarAws);
                console.log('Filas e contratos de mensageria de OS comprovadamente ausentes.');
                break;
              case 'after-apply':
                verificarInfra(contratos, prefix, consultarAws);
                console.log('Recursos e contratos de infraestrutura conferidos; não comprova acesso do workload.');
                break;
              default: throw new Error('Modo de verificação inválido.');
            }
          }
          module.exports = { contratosDoState, verificarPendencias, verificarInfra, verificarRemocao, consultarAws };
          if (require.main === module) { try { main(); } catch (error) { console.error(error.message); process.exit(1); } }
          VALIDACAO_INLINE_2

      - name: "🛡️ Validar state da conta AWS atual"
        run: node "$RUNNER_TEMP/bootstrap-account-state.cjs"

      - name: "🛡️ Bloquear destroy com mensagens pendentes na entrada/DLQ de OS"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/verificar-mensageria-os.cjs" before-destroy

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/prepare-destroy.cjs"

      - name: "🚀 08 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "🔍 09 · Validar configuração do Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "💾 12 · Salvar cache intermediário do state do Terraform"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared

      - name: "📐 13 · Gerar plano do Terraform (apply)"
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan

      - name: "📐 13 · Gerar plano do Terraform (destroy)"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfplan

      - name: "🛡️ 14 · Bloquear infraestrutura compartilhada no plano"
        run: |
          terraform -chdir="$TF_WORKING_DIRECTORY" show -json tfplan > tfplan.json
          python - <<'PY'
          import json
          plan = json.load(open("tfplan.json", encoding="utf-8"))
          blocked_types = {"aws_vpc", "aws_subnet", "aws_nat_gateway", "aws_internet_gateway", "aws_route_table", "aws_route", "aws_route_table_association", "aws_eks_cluster", "aws_eks_node_group", "aws_db_instance", "aws_db_subnet_group", "aws_ecr_repository", "aws_security_group", "aws_security_group_rule", "aws_vpc_security_group_ingress_rule", "aws_vpc_security_group_egress_rule", "aws_lb", "aws_lb_listener", "aws_lb_target_group"}
          blocked_modules = ("module.vpc", "module.eks", "module.rds", "module.ecr")
          violations = [change["address"] for change in plan.get("resource_changes", []) if change.get("mode") == "managed" and (change.get("type") in blocked_types or change.get("address", "").startswith(blocked_modules)) and set(change.get("change", {}).get("actions", [])) & {"create", "update", "delete", "replace"}]
          if violations:
              raise SystemExit("Infraestrutura compartilhada proibida no plano: " + ", ".join(violations))
          PY

      - name: "🧹 15 · Remover arquivo temporário com secrets"
        if: always()
        run: rm -f "$TF_WORKING_DIRECTORY/zz_ci.auto.tfvars.json"

      - name: "⬆️ 16 · Publicar plano do Terraform como artefato"
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/tfplan
            ${{ env.TF_WORKING_DIRECTORY }}/partial_destroy_override.tf
            ${{ env.TF_WORKING_DIRECTORY }}/os-mensageria-destroy-context.json
          retention-days: 1
          if-no-files-found: error

  build_and_push_image:
    name: "🐳 03 · Publicar imagem produzida pela CI"
    needs:
      - resolve_action
      - prepare_and_plan
    if: needs.resolve_action.outputs.terraform_action == 'apply'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_IMAGE_URI: ${{ needs.prepare_and_plan.outputs.ecr_image_uri }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🔓 03 · Login no Amazon ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "🔎 04 · Localizar a CI do PR que foi integrado"
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[] | select(.merged_at != null and .base.ref == \"develop\" and .merge_commit_sha == \"$GITHUB_SHA\") | .number" | head -n 1)"
          test -n "$pr_number" || { echo "::error::PR integrado não encontrado."; exit 1; }
          head_sha="$(gh pr view "$pr_number" --json headRefOid --jq .headRefOid)"
          run_id="$(gh run list --workflow ci.yml --commit "$head_sha" --event pull_request --status success --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id" || { echo "::error::CI aprovada não encontrada para o PR."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: "⬇️ 05 · Baixar imagem da CI aprovada"
        uses: actions/download-artifact@v8
        with:
          name: api-image-pr-${{ steps.ci.outputs.pr_number }}
          path: ${{ runner.temp }}/ci-image
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}

      - name: "🧾 06 · Conferir se o conteúdo integrado é o validado"
        run: |
          test "$(cat "$RUNNER_TEMP/ci-image/source-tree.txt")" = "$(git rev-parse 'HEAD^{tree}')" || {
            echo "::error::O conteúdo integrado difere do validado pela CI. Deploy bloqueado."
            exit 1
          }

      - name: "📤 07 · Publicar a mesma imagem no ECR"
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/ci-image/api-image.tar
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          docker tag "oficina-mecanica-api:ci" "$ECR_IMAGE_URI"
          docker push "$ECR_IMAGE_URI"

  apply_or_destroy:
    name: "☁️ 04 · Aplicar ou destruir infraestrutura"
    needs:
      - resolve_action
      - prepare_and_plan
      - build_and_push_image
    if: always() && needs.resolve_action.result == 'success' && needs.prepare_and_plan.result == 'success' && (needs.resolve_action.outputs.terraform_action == 'destroy' || needs.build_and_push_image.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      eks_cluster_name: ${{ steps.read_outputs.outputs.eks_cluster_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "📦 05 · Restaurar cache do state do Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          restore-keys: |
            tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - *validacoes_inline

      - name: "🛡️ Validar state da conta AWS atual"
        run: node "$RUNNER_TEMP/bootstrap-account-state.cjs"

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/prepare-destroy.cjs"

      - name: "🚀 04 · Inicializar Terraform (baixa os plugins dos providers)"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "⬇️ 06 · Baixar plano do Terraform publicado"
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: "🛡️ Validar plano exclusivo de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/prepare-destroy.cjs" verify-plan

      - name: "🛡️ Revalidar pendências antes do destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/verificar-mensageria-os.cjs" before-destroy

      - name: "✅ 07 · Aplicar plano do Terraform (apply ou destroy)"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan

      - name: "🔎 Confirmar state sem recursos gerenciados"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/prepare-destroy.cjs" verify-state

      - name: "🔎 Conferir filas e contratos após apply"
        if: env.TERRAFORM_ACTION == 'apply'
        run: node "$RUNNER_TEMP/verificar-mensageria-os.cjs" after-apply

      - name: "🔎 Confirmar remoção das filas e contratos de OS"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node "$RUNNER_TEMP/verificar-mensageria-os.cjs" after-destroy

      - name: "💾 08 · Salvar cache final do state do Terraform"
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup
          key: tfstate-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "📖 09 · Ler nome do cluster EKS"
        id: read_outputs
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          eks_cluster_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw eks_cluster_name)"
          echo "eks_cluster_name=$eks_cluster_name" >> "$GITHUB_OUTPUT"

  rollout_check:
    name: "☸️ 05 · Validar rollout da aplicação no EKS"
    needs:
      - resolve_action
      - apply_or_destroy
    if: needs.resolve_action.outputs.terraform_action == 'apply' && needs.apply_or_destroy.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ needs.apply_or_destroy.outputs.eks_cluster_name }}

    steps:
      - name: "🔑 01 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 02 · Instalar kubectl"
        uses: azure/setup-kubectl@v5

      - name: "🔗 03 · Configurar kubeconfig do EKS"
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl config current-context

      - name: "⏳ 04 · Aguardar rollout da aplicação"
        run: |
          set +e
          kubectl rollout status deployment/oficina-mecanica-api -n oficina-mecanica --timeout=600s
          rollout_status=$?

          kubectl get pods -n oficina-mecanica -o wide
          kubectl get svc oficina-mecanica-api -n oficina-mecanica
          kubectl get hpa oficina-mecanica-api-hpa -n oficina-mecanica

          if [ "$rollout_status" -ne 0 ]; then
            echo "::group::Deployment diagnostics"
            kubectl describe deployment oficina-mecanica-api -n oficina-mecanica || true
            kubectl describe pods -n oficina-mecanica -l app=oficina-mecanica-api || true
            kubectl logs deployment/oficina-mecanica-api -n oficina-mecanica --all-containers --tail=200 || true
            echo "::endgroup::"
            exit "$rollout_status"
          fi

      - name: "🔌 05 · Validar Service NodePort da API"
        run: |
          set -euo pipefail

          service_name="oficina-mecanica-api"
          namespace="oficina-mecanica"

          if ! kubectl get service "$service_name" -n "$namespace" > /dev/null; then
            echo "::error::Service $service_name não foi encontrado no namespace $namespace."
            exit 1
          fi

          service_type="$(kubectl get service "$service_name" -n "$namespace" -o jsonpath='{.spec.type}')"
          if [ "$service_type" != "NodePort" ]; then
            echo "::error::Service $service_name possui tipo '$service_type'; esperado: 'NodePort'."
            exit 1
          fi

          node_port="$(kubectl get service "$service_name" -n "$namespace" -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}')"
          if [ -z "$node_port" ] || [ "$node_port" = "0" ]; then
            echo "::error::Service $service_name não possui nodePort configurado na porta 'http'."
            exit 1
          fi

          echo "Service $service_name validado como NodePort na porta $node_port."
