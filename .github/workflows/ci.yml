          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const { contratosDoState, verificarPendencias, verificarInfra, verificarRemocao, consultarAws } = require('./verificar-mensageria-os.cjs');
          const contratos = { entrada_queue_url: 'entrada', entrada_queue_arn: 'arn:entrada', dlq_url: 'dlq', dlq_arn: 'arn:dlq' };
          const vazia = { Attributes: { ApproximateNumberOfMessages: '0', ApproximateNumberOfMessagesNotVisible: '0', ApproximateNumberOfMessagesDelayed: '0' } };

          test('destroy de OS bloqueia mensagens visíveis, em voo, atrasadas e em DLQ', () => {
            verificarPendencias(contratos, servico => { assert.equal(servico, 'sqs'); return vazia; });
            for (const atributo of Object.keys(vazia.Attributes)) {
              for (const fila of ['entrada', 'dlq']) {
                assert.throws(() => verificarPendencias(contratos, (servico, operacao, ...args) =>
                  args.includes(fila) ? { Attributes: { ...vazia.Attributes, [atributo]: '1' } } : vazia), /Mensagens pendentes/);
              }
            }
            assert.throws(() => verificarPendencias(contratos, () => ({ Attributes: {} })), /contagem inválida/);
          });
          test('ausência confirmada permite recuperação; resposta existente ou falha real bloqueia', () => {
            verificarPendencias(contratos, () => null);
            verificarRemocao(contratos, '/oficina-mecanica/development', () => null);
            assert.throws(() => verificarPendencias(contratos, () => { throw new Error('AccessDenied'); }), /AccessDenied/);
            assert.throws(() => verificarRemocao(contratos, '/oficina-mecanica/development', () => { throw new Error('Credencial expirada'); }), /Credencial expirada/);
            assert.throws(() => verificarRemocao(contratos, '/oficina-mecanica/development', () => ({})), /ainda existe/);
          });
          test('contexto vem dos recursos de OS no state mesmo sem outputs após falha parcial', () => {
            const recurso = (name, attributes) => ({ mode: 'managed', type: 'aws_sqs_queue', name, instances: [{ attributes }] });
            assert.deepEqual(contratosDoState({ resources: [recurso('os_entrada', { id: 'entrada', arn: 'arn:entrada' }), recurso('os_dlq', { url: 'dlq', arn: 'arn:dlq' }), recurso('outro', { id: 'nao-pertence-a-este-contrato' })] }), contratos);
            assert.ok(Object.values(contratosDoState({})).every(valor => valor === ''));
          });
          test('pós-apply compara FIFO, retenção, redrive e contratos do owner sem consultar bancos', () => {
            const prefix = '/oficina-mecanica/development';
            const consultar = (servico, operacao, ...args) => {
              assert.ok(['sqs', 'ssm'].includes(servico));
              if (servico === 'sqs') return { Attributes: { QueueArn: args.includes('entrada') ? 'arn:entrada' : 'arn:dlq', FifoQueue: 'true', ContentBasedDeduplication: 'false', MessageRetentionPeriod: args.includes('entrada') ? '345600' : '1209600', VisibilityTimeout: '60', ReceiveMessageWaitTimeSeconds: '20', RedrivePolicy: JSON.stringify({ maxReceiveCount: '5', deadLetterTargetArn: 'arn:dlq' }) } };
              const nome = args[args.indexOf('--name') + 1];
              if (nome === `${prefix}/status/api`) return { Parameter: { Value: 'ready' } };
              const chave = nome.slice(`${prefix}/api/`.length);
              assert.ok(chave in contratos);
              return { Parameter: { Value: contratos[chave], Type: 'String' } };
            };
            verificarInfra(contratos, prefix, consultar);
            assert.throws(() => verificarInfra({ ...contratos, dlq_arn: '' }, prefix, consultar), /State incompleto/);
            assert.throws(() => verificarInfra(contratos, prefix, (servico, ...args) => servico === 'ssm' ? { Parameter: { Value: 'outro', Type: 'String' } } : consultar(servico, ...args)), /Contrato SSM/);
            assert.throws(() => verificarInfra(contratos, prefix, (servico, ...args) => servico === 'sqs' ? { Attributes: {} } : consultar(servico, ...args)), /Fila real/);
          });
          test('classificação da resposta AWS não converte AccessDenied, rede ou JSON inválido em ausência', () => {
            const cp = require('node:child_process');
            const original = cp.execFileSync;
            try {
              for (const codigo of ['AWS.SimpleQueueService.NonExistentQueue', 'QueueDoesNotExist']) {
                cp.execFileSync = () => { const erro = new Error('simulado'); erro.stderr = `An error occurred (${codigo})`; throw erro; };
                assert.equal(consultarAws('sqs', 'get-queue-attributes'), null);
              }
              for (const codigo of ['AccessDenied', 'ExpiredToken', 'RequestTimeout']) {
                cp.execFileSync = () => { const erro = new Error('simulado'); erro.stderr = `An error occurred (${codigo})`; throw erro; };
                assert.throws(() => consultarAws('sqs', 'get-queue-attributes'), /sem comprovar ausência/);
              }
              for (const resposta of ['json-invalido', 'null', '[]', '"texto"']) {
                cp.execFileSync = () => resposta;
                assert.throws(() => consultarAws('sqs', 'get-queue-attributes'), /sem comprovar ausência/);
              }
            } finally { cp.execFileSync = original; }
          });
          TESTE_INLINE_1
          cat > "$RUNNER_TEMP/prepare-destroy.test.cjs" <<'TESTE_INLINE_2'
          const {test} = require('node:test');
          const assert = require('node:assert/strict');
          const {destroyConfig, verifyPlan} = require('./prepare-destroy.cjs');
          test('destroy AWS não inclui contratos SSM nem modifica state', () => {
            const state = {resources:[{mode:'managed',type:'aws_vpc',name:'this',provider:'provider["registry.terraform.io/hashicorp/aws"]'}]};
            const before = JSON.stringify(state);
            assert.match(destroyConfig(state,'us-east-1',()=>assert.fail()), /provider "aws"/);
            assert.equal(JSON.stringify(state),before);
          });
          test('Kubernetes exige ausência comprovada do EKS e usa removed declarativo', () => {
            const state = {resources:[{mode:'data',type:'aws_eks_cluster',instances:[{attributes:{name:'test'}}]}, {mode:'managed',type:'kubernetes_namespace_v1',name:'this'}]};
            assert.throws(()=>destroyConfig(state,'us-east-1',()=>{throw Error('AccessDenied')}),/AccessDenied/);
            assert.match(destroyConfig(state,'us-east-1',name=>assert.equal(name,'test')),/from = kubernetes_namespace_v1.this/);
            assert.match(destroyConfig(state,'us-east-1',()=>{}),/destroy = false/);
            assert.throws(()=>destroyConfig({resources:[state.resources[1]]},'us-east-1',()=>{}),/sem nome/);
          });
          test('plano rejeita criação, atualização e substituição', () => {
            for(const actions of [['create'],['update'],['delete','create']]) assert.throws(()=>verifyPlan({resource_changes:[{address:'test',change:{actions}}]}),/proibida/);
            for(const actions of [['no-op'],['delete'],['forget']]) verifyPlan({resource_changes:[{change:{actions}}]});
          });
          TESTE_INLINE_2
          cat > "$RUNNER_TEMP/fluxo-apply-api.test.cjs" <<'TESTE_INLINE_3'
          const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const cp = require('node:child_process');
          const workflow = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8');
          function executar({ habilitado = 'true', ref = 'refs/heads/develop', controle = 'TERRAFORM_ACTION=apply', dedicado = true } = {}) {
            const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'fluxo-api-'));
            try {
              const git = (...args) => cp.execFileSync('git', args, { cwd: dir, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
              git('init', '-q');
              git('config', 'user.email', 'teste@example.invalid');
              git('config', 'user.name', 'Teste');
              fs.mkdirSync(path.join(dir, 'terraform'));
              const arquivo = path.join(dir, 'terraform', 'terraform-action.env');
              fs.writeFileSync(arquivo, 'TERRAFORM_ACTION=apply');
              git('add', '.'); git('commit', '-qm', 'base');
              const before = git('rev-parse', 'HEAD');
              if (controle === null) fs.unlinkSync(arquivo);
              else fs.writeFileSync(arquivo, controle);
              git('add', '.'); git('commit', '--allow-empty', '-qm', 'acao');
              const after = git('rev-parse', 'HEAD');
              const blocos = [...workflow.split('  prepare_and_plan:')[0].matchAll(/        run: \|\r?\n([\s\S]*?)(?=\r?\n      - |$)/g)]
                .map(match => match[1].split(/\r?\n/).map(linha => linha.slice(10)).join('\n'));
              assert.equal(blocos.length, 2);
              const resultado = cp.spawnSync('bash', ['-e', '-o', 'pipefail', '-c', blocos.join('\n')], {
                cwd: dir, encoding: 'utf8', env: { ...process.env, DEPLOY_ENABLED: habilitado, GITHUB_REF: ref,
                  TF_WORKING_DIRECTORY: 'terraform', GITHUB_OUTPUT: 'saida', GITHUB_BEFORE: dedicado ? before : after, GITHUB_AFTER: after }
              });
              if (resultado.error) throw resultado.error;
              return { status: resultado.status, saida: fs.existsSync(path.join(dir, 'saida')) ? fs.readFileSync(path.join(dir, 'saida'), 'utf8') : '' };
            } finally { fs.rmSync(dir, { recursive: true, force: true }); }
          }
          test('API exige habilitação, develop e ação explícita antes de liberar apply', () => {
            for (const opcoes of [{ habilitado: 'false' }, { habilitado: '' }, { ref: 'refs/heads/main' },
              { controle: null }, { controle: '' }, { controle: 'TERRAFORM_ACTION=invalido' }]) {
              const resultado = executar(opcoes);
              assert.notEqual(resultado.status, 0);
              assert.equal(resultado.saida, '');
            }
            const resultado = executar();
            assert.equal(resultado.status, 0);
            assert.equal(resultado.saida.trim(), 'terraform_action=apply');
          });
          test('API preserva destroy dedicado e bloqueia reutilização sem alterar controle', () => {
            assert.equal(executar({ controle: 'TERRAFORM_ACTION=destroy' }).saida.trim(), 'terraform_action=destroy');
            assert.notEqual(executar({ controle: 'TERRAFORM_ACTION=destroy', dedicado: false }).status, 0);
          });
          TESTE_INLINE_3
          node --test "$RUNNER_TEMP/bootstrap-account-state.test.cjs" "$RUNNER_TEMP/mensageria-os.test.cjs" "$RUNNER_TEMP/prepare-destroy.test.cjs" "$RUNNER_TEMP/fluxo-apply-api.test.cjs"

      - name: "🧪 Testar composição real dos workers OS"
        run: |
          python - <<'TESTAR_CONFIGURACAO_OS'
          import ast, json, os, re, textwrap
          from pathlib import Path
          from unittest.mock import patch
          origem = Path('.github/workflows/aws-deploy.yml').read_text(encoding='utf-8')
          trecho = origem.split('          def configuracao_fluxo():', 1)[1].split('          terraform_action =', 1)[0]
          codigo = textwrap.dedent('          def configuracao_fluxo():' + trecho)
          ambiente = {'TERRAFORM_ACTION':'apply','AWS_REGION':'us-east-1','SSM_ENVIRONMENT_NAME':'development'}
          conta = '123456789012'
          def executar(flags=None, defeito=None):
              chamadas = []
              def aws(*args):
                  chamadas.append(args)
                  if defeito == 'acesso': raise RuntimeError('AccessDenied simulado')
                  if args[0] == 'sts': return conta
                  if args[0] == 'ssm':
                      nome = args[args.index('--name') + 1]
                      if '/status/' in nome: return 'pending' if defeito == 'status' else 'ready'
                      owner = nome.split('/')[-2]
                      fila = 'oficina-mecanica-' + owner + '-development.fifo'
                      if nome.endswith('queue_url'):
                          return 'https://sqs.us-east-1.amazonaws.com/' + ('999999999999' if defeito == 'conta' else conta) + '/' + fila
                      return 'arn:aws:sqs:us-east-1:' + conta + ':' + fila
                  if args[0] == 'sqs':
                      fila = args[args.index('--queue-url') + 1].split('/')[-1]
                      return json.dumps({'QueueArn': 'arn:aws:sqs:us-east-1:' + conta + ':' + fila, 'FifoQueue': 'false' if defeito == 'fifo' else 'true'})
                  raise AssertionError('Consulta inesperada no teste')
              contexto = {'os': os, 'json': json, 'aws_output': aws}
              with patch.dict(os.environ, {**ambiente, **(flags or {})}, clear=True):
                  exec(compile(ast.parse(codigo), '<composicao-real>', 'exec'), contexto)
                  resultado = contexto['configuracao_fluxo']()
              return resultado, chamadas
          resultado, chamadas = executar()
          assert not resultado['processamento_remoto_habilitado'] and chamadas == []
          resultado, chamadas = executar({'TERRAFORM_ACTION':'destroy','PROCESSAMENTO_REMOTO_ENABLED':'invalido'})
          assert not resultado['fluxo_distribuido_habilitado'] and chamadas == []
          flags = {'PROCESSAMENTO_REMOTO_ENABLED':'true','FLUXO_DISTRIBUIDO_ENABLED':'true','CLIENTES_API_ENABLED':'true'}
          resultado, chamadas = executar(flags)
          assert resultado['fluxo_distribuido_habilitado'] and resultado['conta_aws'] == conta
          assert resultado['execucao_entrada_queue_url'] != resultado['orcamento_pagamento_entrada_queue_url']
          for valores, defeito in [({'FLUXO_DISTRIBUIDO_ENABLED':'true'},None), ({'PROCESSAMENTO_REMOTO_ENABLED':'TRUE'},None), (flags,'conta'), (flags,'fifo'), (flags,'status'), (flags,'acesso')]:
              try: executar(valores, defeito)
              except (ValueError, RuntimeError): pass
              else: raise AssertionError('Configuração indevida não foi bloqueada: ' + str(defeito))
          print('Nove cenários de composição real aprovados, sem chamadas AWS.')
          import contextlib, io, subprocess, tempfile
          codigo_status = textwrap.dedent(re.search(r"          python - <<'INVALIDAR_API'\n(.*?)\n          INVALIDAR_API", origem, re.S).group(1))
          nome_status = '/oficina-mecanica/development/status/api-aplicacao'
          arn_status = 'arn:aws:ssm:us-east-1:' + conta + ':parameter' + nome_status
          for caso in ['sem-state','correto','nome-alheio','arn-alheio','acesso','ausente']:
              with tempfile.TemporaryDirectory(prefix='oficina-status-os-') as pasta:
                  state = {'resources':[{'mode':'managed','type':'aws_ssm_parameter','name':'api_aplicacao_status','instances':[{'attributes':{'name':nome_status if caso!='nome-alheio' else '/outro/status','arn':arn_status}}]}]}
                  if caso!='sem-state': (Path(pasta)/'terraform.tfstate').write_text(json.dumps(state),encoding='utf-8')
                  chamadas=[]
                  def consultar(args, **kwargs):
                      chamadas.append(args)
                      if args[2]=='get-parameter':
                          if caso in ['acesso','ausente']:
                              return subprocess.CompletedProcess(args,1,stdout='',stderr='(ParameterNotFound)' if caso=='ausente' else '(AccessDeniedException)')
                          return subprocess.CompletedProcess(args,0,stdout=json.dumps({'Parameter':{'Type':'String','ARN':arn_status if caso!='arn-alheio' else 'arn:outro'}}))
                      assert args[2]=='put-parameter' and args[args.index('--name')+1]==nome_status
                      assert args[args.index('--value')+1]=='implantacao-pendente'
                      return subprocess.CompletedProcess(args,0,stdout='')
                  try:
                      with patch.dict(os.environ,{'TF_WORKING_DIRECTORY':pasta,'SSM_ENVIRONMENT_NAME':'development'},clear=True),patch('subprocess.run',side_effect=consultar),contextlib.redirect_stdout(io.StringIO()):
                          exec(compile(codigo_status,'<status-real>','exec'),{})
                  except (ValueError,RuntimeError):
                      assert caso in ['nome-alheio','arn-alheio','acesso']
                  else:
                      assert caso not in ['nome-alheio','arn-alheio','acesso']
                      assert any(a[2]=='put-parameter' for a in chamadas)==(caso=='correto')
          print('Seis cenários de invalidação do status aprovados, sem mutação real.')
          TESTAR_CONFIGURACAO_OS

      - name: "❤️ Testar publicação de disponibilidade da API"
        run: |
